<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Already Reported - JanHelp</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dk1q50evg/image/upload/logo">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #1E66F5;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            background: #f8fafc;
        }

        .bg-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            background-size: cover;
            background-position: center;
            filter: blur(4px);
        }

        @media (min-width: 1025px) {
            .bg-container { background-image: url("https://res.cloudinary.com/dk1q50evg/image/upload/login-bg-web"); }
        }

        @media (max-width: 1024px) {
            .bg-container { background-image: url("https://res.cloudinary.com/dk1q50evg/image/upload/login-bg-mobile"); }
        }

        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, rgba(30, 102, 245, 0.2) 0%, rgba(102, 126, 234, 0.15) 50%, rgba(118, 75, 162, 0.1) 100%);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 50px rgba(30, 102, 245, 0.15), 0 0 100px rgba(30, 102, 245, 0.05);
            padding: 40px 30px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .icon-box {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(245, 158, 11, 0.3);
            animation: checkmarkPop 0.8s ease-out 0.3s both;
        }

        @keyframes checkmarkPop {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        .icon-box i { font-size: 36px; color: #fff; }

        h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 12px;
        }

        p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 24px;
        }

        .ticket-id-box {
            background: rgba(245, 158, 11, 0.08);
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 28px;
            display: inline-block;
        }

        .ticket-id-box .label {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .ticket-id {
            font-family: 'Inter', monospace;
            font-size: 20px;
            font-weight: 800;
            color: #d97706;
            letter-spacing: 2px;
        }

        .btn-group { display: flex; flex-direction: column; gap: 10px; }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-blue) 0%, #154ec7 100%);
            color: #fff;
            box-shadow: 0 8px 16px rgba(30, 102, 245, 0.2);
        }

        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(30, 102, 245, 0.3); }

        .btn-outline {
            background: #fff;
            border: 1.5px solid #e2e8f0;
            color: var(--text-dark);
            text-transform: none;
            letter-spacing: 0;
            font-weight: 600;
        }

        .btn-outline:hover { background: #f8fafc; border-color: var(--primary-blue); color: var(--primary-blue); transform: translateY(-2px); }

        @media (max-width: 480px) {
            .glass-card { padding: 30px 20px; border-radius: 20px; }
            h1 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="bg-container"></div>
    <div class="bg-overlay"></div>

    <div class="glass-card">
        <div class="icon-box">
            <i class="fa-solid fa-circle-check"></i>
        </div>
        <h1>Already Reported!</h1>
        <p>This issue has already been reported by another citizen in this area. Our team is already working on it.</p>

        <div class="ticket-id-box">
            <div class="label">Existing Ticket ID</div>
            <span class="ticket-id">{{ masked_id }}</span>
        </div>

        <div class="btn-group">
            <a href="{% url 'user_dashboard' %}" class="btn btn-primary">
                <i class="fa-solid fa-heart"></i>
                Thank You
            </a>

            <form action="{% url 'preview_complaint' %}" method="post" style="display: block;">
                {% csrf_token %}
                <input type="hidden" name="confirm" value="true">
                <input type="hidden" name="bypass_duplicate" value="true">
                <button type="submit" class="btn btn-outline">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    No, my issue is different
                </button>
            </form>
        </div>
    </div>
</body>
</html>
